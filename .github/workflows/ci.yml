name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Sin permisos de escritura: la CI solo verifica, no despliega (Iteración 19).
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          # 20 es la versión mínima soportada (engines); 22 es la de desarrollo.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      # Los tests levantan un MongoDB en memoria: se cachea el binario para no
      # descargarlo en cada corrida.
      - name: Caché del binario de MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Tests
        run: npm test

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
